# ═══════════════════════════════════════════════════════════════════════════
#  Publish — build the container image and push it to GitHub Container Registry.
#
#  Runs on a version tag (v1.2.3) and on manual dispatch. Deliberately NOT on
#  every push to master: an image published per commit produces a registry
#  nobody can navigate and a "latest" that means nothing in particular. A tag is
#  a decision that something is releasable; this workflow acts on that decision.
#
#  ── Why ghcr.io, and how it authenticates ──────────────────────────────────
#
#  GitHub Container Registry needs no secret. The automatic GITHUB_TOKEN,
#  scoped by `permissions: packages: write` below, is the credential — so there
#  is nothing to rotate and nothing to leak, which is the same principle the
#  application itself follows with managed identity.
#
#  To publish to Azure Container Registry instead, replace the login step with
#  azure/login@v2 using OIDC federated credentials (`id-token: write`) and point
#  REGISTRY at <your-registry>.azurecr.io. Do not add a registry password as a
#  repository secret — see DEPLOYMENT.md.
# ═══════════════════════════════════════════════════════════════════════════

name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # Lets the build publish a signed provenance attestation, which is what makes
  # the image's origin verifiable rather than merely labelled.
  attestations: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a publish. A half-cancelled push can leave a manifest
  # referencing layers that were never uploaded.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The image is only worth publishing if the code passes. This duplicates the
  # CI gate rather than trusting that it ran: tags can be pushed to a commit
  # that never saw a pull request.
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KnowledgeAssistant.slnx

      - name: Build
        run: dotnet build KnowledgeAssistant.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test KnowledgeAssistant.slnx --configuration Release --no-build

  publish:
    name: Push image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The automatic token, not a stored secret.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long
            # latest only for a real semver tag, and never for a prerelease —
            # so `docker pull ...:latest` cannot silently hand someone a beta.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Merged with the OCI labels baked into the Dockerfile. These add the
          # revision and build time, which the Dockerfile cannot know.
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 and arm64: Azure Container Apps and App Service run
          # amd64, while Apple Silicon laptops run arm64. Publishing one forces
          # everyone else through emulation.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # The image is public; the attestation should be too, or nobody
          # pulling it can verify what they pulled.
          push-to-registry: true
