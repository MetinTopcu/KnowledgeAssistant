# ═══════════════════════════════════════════════════════════════════════════
#  CI — build and test every pull request, and every push to master.
#
#  This is the gate, and the only place the validation steps are written down.
#  Pull requests run it directly. Pushes to master run it through
#  acr-publish.yml, which calls this workflow and publishes an image only if it
#  passes — so a master commit is validated exactly once, not once here and
#  again there.
#
#  It runs the same three suites a developer runs locally
#  (unit, integration, architecture) and it runs them in Release, because
#  Release is what ships and because analyzer behaviour differs by
#  configuration.
#
#  Nothing here touches Azure. The integration suite hosts the real API in
#  memory through WebApplicationFactory with the Azure-backed ports
#  substituted, so it needs no endpoint, no credential, and no network — which
#  is what lets this workflow run on a fork's pull request with no secrets at
#  all.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [master]
  # Called by acr-publish.yml on every push to master. There is deliberately no
  # `push` trigger here: it would run this whole workflow a second time,
  # alongside the copy acr-publish.yml already runs for the same commit.
  workflow_call:

# Least privilege. This workflow reads code and writes a check summary; it has
# no reason to be able to push, publish a package, or open an issue. The
# default token is far broader, so it is narrowed explicitly.
permissions:
  contents: read

# A second push to the same branch cancels the first. Without this, a burst of
# commits leaves several minutes of obsolete runs competing for runners while
# the one that matters queues behind them. Never cancels on master, where every
# commit's result is a fact worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  # Skips the ~10s first-run package extraction on a runner that is discarded
  # immediately afterwards.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global-json-file, not a hardcoded version. The SDK is pinned in
          # global.json because the analyzer set behind
          # AnalysisLevel=latest-recommended changes between feature bands, and
          # TreatWarningsAsErrors turns that into a build failure. Naming a
          # version here as well would create a second source of truth, and the
          # first upgrade would move only one of them.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Central Package Management means these three files fully determine
          # the graph, so the key changes exactly when the dependencies do.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore KnowledgeAssistant.slnx

      - name: Build
        # --no-restore so a restore failure is reported by the step above rather
        # than buried in build output. Warnings are already errors via
        # Directory.Build.props; this does not need to add -warnaserror.
        run: dotnet build KnowledgeAssistant.slnx --configuration $CONFIGURATION --no-restore

      - name: Test
        # --no-build guarantees the assemblies tested are the ones just built,
        # rather than a silent rebuild under different inputs.
        run: >
          dotnet test KnowledgeAssistant.slnx
          --configuration $CONFIGURATION
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ${{ runner.temp }}/test-results

      - name: Publish test results
        # always(), so a failing suite still uploads its report — the run where
        # the results matter most is the one that failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          retention-days: 14

  # Proves the Dockerfile still builds, on the same events as the tests.
  # Separated from the job above because it shares nothing with it: a different
  # toolchain, a different cache, and a failure here means the image is broken
  # rather than the code.
  #
  # This job is why CI would have caught the CA1716 build break that the
  # container surfaced: the runtime image pins an SDK feature band that a
  # developer's machine may not have.
  docker:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Built and discarded. Publishing happens only in acr-publish.yml,
          # after this workflow passes, on master — a pull request from a fork
          # must never be able to push an image to the registry.
          push: false
          load: true
          tags: knowledge-assistant-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Proves the container actually starts and serves liveness, which a
        # successful build does not. Dependency checks are off and the endpoints
        # are unroutable placeholders: this asserts the host boots and the
        # liveness probe answers, not that Azure is reachable.
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e Azure__Storage__ServiceUri=https://example.invalid/ \
            -e Azure__Search__Endpoint=https://example.invalid/ \
            -e Azure__AiFoundry__Endpoint=https://example.invalid/ \
            -e Azure__AiFoundry__ChatDeploymentName=placeholder \
            -e Azure__AiFoundry__EmbeddingDeploymentName=placeholder \
            -e Azure__AiFoundry__Agent__ProjectEndpoint=https://example.invalid/api/projects/placeholder \
            -e Azure__AiFoundry__Agent__Version=1 \
            -e Observability__HealthChecks__EnableDependencyChecks=false \
            knowledge-assistant-api:ci

          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/live)" = "200" ]; then
              echo "Liveness answered 200 after ${attempt}s."
              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::The container did not answer /health/live within 30s."
          docker logs smoke
          docker rm -f smoke > /dev/null
          exit 1

  # The web client, verified the same way the API is: the checks a developer
  # runs locally, in the order that fails fastest. `npm ci` and not `npm
  # install` — ci installs the lockfile exactly and fails if package.json and
  # the lockfile disagree, which is the whole point of committing a lockfile.
  web:
    name: Build web client
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: KnowledgeAssistant.Web

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 20.x, matching the floor Vite 8 declares (^20.19 || >=22.12) and the
          # version used locally. The npm cache is keyed on the lockfile, which
          # lives under the client directory rather than the repo root.
          node-version: 20.x
          cache: npm
          cache-dependency-path: KnowledgeAssistant.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # `tsc -b --noEmit` over the project references. Vite strips types
        # without checking them, so a build alone would not catch a type error.
        run: npm run typecheck

      - name: Build
        run: npm run build
