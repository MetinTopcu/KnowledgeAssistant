# ═══════════════════════════════════════════════════════════════════════════
#  KnowledgeAssistant — local development stack
#
#      cp .env.example .env      # then fill in your endpoints
#      az login                  # the container reuses this login
#      docker compose up --build
#
#      API      http://localhost:8080
#      Health   http://localhost:8080/health
#      Traces   http://localhost:18888
#      Azurite  http://localhost:10000/devstoreaccount1
#
#  ── Blob storage is emulated; everything else is real Azure ────────────────
#
#  Documents are stored in Azurite, the local Blob Storage emulator, so uploads
#  cost nothing and need no storage account. Azure AI Search and Azure AI
#  Foundry have no emulator, so those still come from .env and your own login.
#
#  Azurite accepts only its well-known shared key, over plain HTTP. The API
#  therefore reaches it through Azure:Storage:ConnectionString — a path the
#  application refuses outside the Development environment, and refuses for any
#  account other than devstoreaccount1 with Azurite's published key. Deployed
#  environments keep Azure:Storage:ServiceUri and DefaultAzureCredential; see
#  DEPLOYMENT.md. The key below is public and identical on every installation.
# ═══════════════════════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    image: knowledge-assistant-api:local
    container_name: knowledge-assistant-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Development turns on the OpenAPI document at /openapi/v1.json. It does
      # NOT relax any validation: every options class is still ValidateOnStart,
      # so a missing endpoint fails this container at boot rather than on the
      # first request.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # Sends traces and metrics to the dashboard below. Overrides whatever is
      # in .env, because inside this network the collector is always this host.
      Observability__Otlp__Endpoint: http://aspire-dashboard:18889

      # The az-CLI token cache is mounted at a fixed path below; this tells the
      # Azure SDK where to look for it inside the container.
      AZURE_CONFIG_DIR: /home/app/.azure

      # Blob storage goes to the azurite service below. Set here rather than in
      # .env so it overrides whatever .env says: `environment` takes precedence
      # over `env_file`. ServiceUri is emptied deliberately, because the
      # application refuses to start with both set. BlobEndpoint names the
      # compose service, not 127.0.0.1, which inside this container is the API
      # itself.
      Azure__Storage__ServiceUri: ""
      Azure__Storage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

    # Endpoints and deployment names come from .env, which is gitignored.
    # Compose reads it automatically. Nothing in it is a credential.
    env_file:
      - .env

    volumes:
      # Your `az login` token cache, read-only.
      #
      # ro is not decoration. The cache holds live refresh tokens for your own
      # account; a writable mount would let anything in the container modify or
      # replace them. Read-only is enough for DefaultAzureCredential, which only
      # reads.
      #
      # Set AZURE_CONFIG_DIR in .env to your host path — Docker cannot expand ~.
      - "${AZURE_CONFIG_DIR:?set AZURE_CONFIG_DIR in .env to your .azure directory — see .env.example}:/home/app/.azure:ro"

    depends_on:
      aspire-dashboard:
        condition: service_started
      azurite:
        condition: service_started

    healthcheck:
      # Liveness, matching the Dockerfile: this decides whether to restart the
      # container, and restarting cannot fix an unreachable Azure dependency.
      test: ["CMD", "/usr/bin/timeout", "3", "/bin/bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # The .NET Aspire dashboard, used here purely as a standalone OTLP collector
  # and trace viewer. The application already emits OpenTelemetry through BCL
  # types and exports over OTLP when Observability:Otlp:Endpoint is set — this
  # gives that somewhere to go without an Azure Monitor workspace, so a laptop
  # can see the same spans production does.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: knowledge-assistant-traces
    restart: unless-stopped

    ports:
      - "18888:18888"   # UI
      - "18889:18889"   # OTLP/gRPC ingest

    environment:
      # Local-only, and the reason this compose file must never be used as a
      # deployment template: it disables the dashboard's login token so the UI
      # opens without one. Anyone who can reach the port can read every trace,
      # which is fine on loopback and unacceptable anywhere else.
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured

  # Local Blob Storage emulator. Blob service only: the queue and table services
  # are not started because nothing in this solution uses them.
  azurite:
    # Pinned, not :latest. Azurite rejects requests whose x-ms-version it does
    # not recognise, and Azure.Storage.Blobs 12.29.1 sends 2026-06-06, so an
    # unpinned image could silently start refusing every call after a pull.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: knowledge-assistant-azurite
    restart: unless-stopped

    # 0.0.0.0 because Azurite binds loopback by default, which inside a
    # container is unreachable from both the API container and the host.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data"]

    ports:
      - "10000:10000"

    volumes:
      # Named volume, so uploaded documents survive `docker compose down`.
      # `docker compose down -v` is the reset.
      - azurite-data:/data

volumes:
  azurite-data:
